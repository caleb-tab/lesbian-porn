<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Video Embed</title>
    <style>
        /* General Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container for the Video */
        .video-container {
            position: relative;
            width: 90%;
            max-width: 700px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 30px rgba(0, 255, 255, 0.6);
            overflow: hidden;
        }

        /* Video Title Styling */
        .video-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ffff;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        /* Styling for the iframe */
        .video-container iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        /* Glowing Border Animation */
        .video-container {
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 30px rgba(0, 255, 255, 0.6);
            }
            100% {
                box-shadow: 0 0 30px rgba(0, 255, 255, 1), 0 0 50px rgba(0, 255, 255, 0.8);
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-title">Futuristic Video Embed</div>
        <iframe src="https://www.xvideos.com/embedframe/hiamidd6d18" allowfullscreen></iframe>
    </div>
</body>
</html>
